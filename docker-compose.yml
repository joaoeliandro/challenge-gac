services:
  postgres:
    image: postgres:16-alpine
    container_name: carteira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: carteira
      POSTGRES_DB: carteira_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carteira']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: carteira_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: carteira_web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
